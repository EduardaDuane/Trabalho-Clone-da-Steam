<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam - Exercício 13</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-principal">
        <div class="container-header"> 
            
            <a href="#" class="logo-link">
                <img src="img/logo.png" alt="Steam Logo" class="logo-imagem">
            </a>

            <nav class="nav-principal">
                <ul>
                    <li><a href="#" class="active-header">LOJA</a></li>
                    <li><a href="#">COMUNIDADE</a></li>
                    <li><a href="#">SOBRE</a></li>
                    <li><a href="#">SUPORTE</a></li>
                </ul>
            </nav>

            <div class="area-usuario">
                <a href="#" class="btn-instalar">
                    <span class="icone-monitor"></span>
                    Instale o Steam
                </a>
                <a href="#" class="link-sessao">iniciar sessão</a>
                <a href="#" class="idioma">
                    <span class="icone-globo"></span>
                    idioma
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="container-main">
            <nav class="nav-secundaria">
                <ul class="nav-secundaria-links">
                    <li><a href="#" class="active">Explorar</a></li>
                    <li><a href="#">Recomendações</a></li>
                    <li><a href="#">Categorias</a></li>
                    <li><a href="#">Formas de jogar</a></li>
                    <li><a href="#">Seções especiais</a></li>
                </ul>
                <div class="barra-busca">
                    <input type="search" placeholder="Buscar na loja">
                    <button type="submit" class="btn-busca"></button>
                </div>
            </nav>

            <section class="destaques">
                <h2>DESTAQUES E RECOMENDADOS</h2>

                <div class="card-destaque">
                    
                    <div class="nav-arrow left">
                        <span>
                        </span>
                    </div>

                    <div class="destaque-imagem-principal">
                        <img src="img/thesims.jpg" alt="Throne and Liberty - Imagem Principal">
                    </div>

                    <div class="destaque-info">
                        <div class="info-texto">
                            <h3>THE SIMS 4</h3>
                        </div>
                        
                        <div class="destaque-galeria">
                            <img src="img/fifa.webp" alt="Miniatura 1">
                            <img src="img/foto3.jpg" alt="Miniatura 3">
                            <img src="img/foto1.jpg" alt="Miniatura 6">
                            <img src="img/gta.webp" alt="Miniatura 7">
                        </div>

                        <div class="bloco-info-disponibilidade">
                            <p class="disponibilidade">Já disponível</p>
                            <div class="linha-popular-gratuito">
                                <span class="tag-popular">Popular</span>
                                <p class="texto-gratuito">Gratuito para jogar</p>
                                <div class="icone-grade"></div>
                            </div>
                        </div>
                        </div>
                    
                    <div class="nav-arrow right">
                        <span>></span>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
